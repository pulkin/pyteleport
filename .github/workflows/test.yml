# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on: [push, pull_request, workflow_dispatch]

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: uv sync --no-locked --python "${{ matrix.python-version }}"
    - name: Save binaries
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.python-version }}
        path: |
          pyteleport/*.so
    - name: Test
      run: uv run pytest -v

  test-install:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Build
      run: uv build --python "${{ matrix.python-version }}"
    - name: Create test environment
      run: uv venv --python "${{ matrix.python-version }}"
    - name: Install sdist
      run: uv pip install --python .venv/bin/python pytest dist/*.tar.gz
    - name: Test
      run: |
        mkdir ../empty
        cd ../empty
        "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest --pyargs pyteleport
